# =============================================================================
# FUNCREES — Nginx para producción (SvelteKit SSR + Django API)
# =============================================================================
# Arquitectura:
#   Nginx :443
#     ├── /              → Node.js (SvelteKit adapter-node, puerto 3000)
#     ├── /api/, /admin/ → Gunicorn (Django, puerto 8000)
#     └── /static/       → archivos estáticos del Admin Django (WhiteNoise)
#
# El frontend SSR y la API se sirven en el MISMO dominio: no hay CORS ni
# cookies cross-site, y el proxy de /api/ mantiene la compatibilidad con el
# cliente API del frontend (API_BASE = '/api').
#
# Requisitos previos:
#   - Servicio systemd "funcrees-web"  (node build/index.js en :3000)
#   - Servicio systemd "funcrees"      (gunicorn core.wsgi en :8000)
#   - Certificados TLS de Certbot (descomentar las líneas ssl_certificate)
# =============================================================================

# Zona de rate-limiting para la API.
# 10 peticiones por segundo por IP, con una ráfaga de 20.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Zona de rate-limiting genérica (más permisiva) para el resto del sitio.
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# =============================================================================
# Servidor HTTP → redirige todo a HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name funcreescolombia.org www.funcreescolombia.org;

    # ACME challenge para Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir el resto del tráfico HTTP a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# Servidor HTTPS — principal
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name funcreescolombia.org www.funcreescolombia.org;

    # --- SSL / TLS (Certbot llena estos valores automáticamente) -------------
    # ssl_certificate     /etc/letsencrypt/live/funcreescolombia.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/funcreescolombia.org/privkey.pem;

    # Protocolos TLS — solo versiones seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Sesiones SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Límite de tamaño de cuerpo de petición (subidas) --------------------
    client_max_body_size 10m;

    # --- Timeouts de proxy ---------------------------------------------------
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
    send_timeout          60s;

    # --- Cabeceras de seguridad (aplican a todas las respuestas) -------------
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP ajustada al stack real:
    #   - fonts.googleapis/gstatic (Google Fonts)
    #   - cdnjs (Font Awesome)
    #   - imágenes Unsplash + tiles de OpenStreetMap/Carto
    #   - connect-src 'self' (la API vive en el mismo origen) + Wompi sandbox/prod
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; connect-src 'self' https://sandbox.wompi.co https://production.wompi.co; frame-src https://checkout.wompi.co;" always;

    # --- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/funcrees_access.log;
    error_log  /var/log/nginx/funcrees_error.log warn;

    # --- Protección contra ataques comunes -----------------------------------
    # Bloquear acceso a archivos ocultos (ej: .git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # ==========================================================================
    # FRONTEND (SvelteKit SSR vía adapter-node)
    # ==========================================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        limit_req zone=general_limit burst=30 nodelay;
    }

    # Activos inmutables de Vite: hash en el nombre → caché de 1 año.
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================================================
    # BACKEND (Django API — con rate-limiting)
    # ==========================================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No almacenar en caché respuestas de la API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --- Health-check (sin rate-limit agresivo) ------------------------------
    location = /api/health/ {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin de Django ------------------------------------------------------
    location /admin/ {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # STATIC FILES (Django Admin / WhiteNoise)
    # ==========================================================================
    location /static/ {
        alias /var/www/funcrees/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================================
    # MEDIA — fotos de beneficiarios e imágenes de eventos subidas desde el
    # panel de administración. Sin cache agresivo: el personal puede
    # reemplazar una foto y esperar ver el cambio de inmediato.
    # ==========================================================================
    location /media/ {
        alias /var/www/funcrees/backend/media/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
