# =============================================================================
# FUNCREES — Configuración de Nginx para producción
# =============================================================================
# Ubicación sugerida: /etc/nginx/sites-available/funcrees.conf
# Activar con: ln -s /etc/nginx/sites-available/funcrees.conf /etc/nginx/sites-enabled/
# =============================================================================

# ---------------------------------------------------------------------------
# Zona de rate-limiting para la API.
# 10 peticiones por segundo por IP, con un ráfaga de 20.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Zona de rate-limiting genérica (más permisiva) para el resto del sitio.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;


# =============================================================================
# Servidor HTTP → redirige todo a HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;  # Reemplazar con el dominio real, ej: api.funcrees.org

    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}


# =============================================================================
# Servidor HTTPS — principal
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;  # Reemplazar con el dominio real, ej: api.funcrees.org

    # --- Ocultar la versión de Nginx en las cabeceras de respuesta -----------
    server_tokens off;

    # --- SSL / TLS (Certbot llenará estos valores automáticamente) -----------
    # ssl_certificate     /etc/letsencrypt/live/api.funcrees.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.funcrees.org/privkey.pem;

    # Si aún no tienes el certificado, descomenta la siguiente línea para
    # poder probar con HTTP mientras Certbot genera el certificado:
    # ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    # ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    # Protocolos TLS — solo versiones seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Sesiones SSL
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (descomentar cuando exista el certificado real)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # --- Límite de tamaño de cuerpo de petición (subidas) --------------------
    client_max_body_size 10m;

    # --- Timeouts de proxy ---------------------------------------------------
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
    send_timeout          60s;

    # --- Cabeceras de seguridad (aplican a todas las respuestas) --------------
    # Impedir MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Impedir clickjacking — la app no debe embebida en iframes
    add_header X-Frame-Options "DENY" always;

    # Activar filtro XSS en navegadores antiguos (IE, Chrome < 78)
    add_header X-XSS-Protection "1; mode=block" always;

    # Política de referer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: desactivar APIs del navegador que no se necesitan
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy básico para API REST (solo JSON)
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Indica a Django el esquema original (necesario para SECURE_SSL_REDIRECT, etc.)
    add_header X-Forwarded-Proto $scheme always;

    # HSTS (complementa la configuración de Django)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Logs ----------------------------------------------------------------
    access_log /var/log/nginx/funcrees_access.log;
    error_log  /var/log/nginx/funcrees_error.log warn;

    # --- Protección contra ataques comunes -----------------------------------
    # Bloquear acceso a archivos ocultos (ej: .git, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Bloquear accesos a archivos sensibles del proyecto
    location ~* /(settings\.py|manage\.py|wsgi\.py|gunicorn\.conf\.py)$ {
        deny all;
        return 404;
    }

    # --- Archivos estáticos --------------------------------------------------
    location /static/ {
        alias /home/funcrees/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Archivos multimedia -------------------------------------------------
    location /media/ {
        alias /home/funcrees/backend/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # --- API — con rate-limiting ---------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No almacenar en caché respuestas de la API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # --- Health-check (sin rate-limit agresivo) ------------------------------
    location /api/health/ {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin de Django (protegido adicionalmente por auth) ------------------
    location /admin/ {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Bloquear todo lo que no coincida con las rutas anteriores -----------
    location / {
        return 404;
    }
}