<!doctype html>
<html lang="es">
        <head>
                <meta charset="utf-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <meta name="theme-color" content="#1a4d2e" />

                <!-- Favicons optimizados (antes: Logo.png de 2.4 MB como icono) -->
                <link rel="icon" href="%sveltekit.assets%/assets/favicon.ico" sizes="48x48" />
                <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/assets/favicon-32.png" />
                <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/assets/favicon-16.png" />
                <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/assets/apple-touch-icon.png" />

                <!-- PWA -->
                <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

                <!-- Google Fonts (Inter & Outfit) -->
                <link rel="preconnect" href="https://fonts.googleapis.com" />
                <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
                <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" />

                <!-- FontAwesome Icons -->
                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

                %sveltekit.head%
        </head>
        <body data-sveltekit-preload-data="hover">
                <div style="display: contents">%sveltekit.body%</div>
        </body>
</html>
