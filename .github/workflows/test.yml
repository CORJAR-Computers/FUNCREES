name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Type check (svelte-check)
        run: npm --prefix frontend run check

      - name: Build production (adapter-node)
        run: npm --prefix frontend run build

      - name: Run frontend tests
        run: node --test frontend/tests/*.test.js

      - name: Dependency audit (npm)
        continue-on-error: true # advisory: no rompe el pipeline, pero deja evidencia
        run: npm --prefix frontend audit --audit-level=high

  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django system checks (deployment strict)
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DEBUG: 'False'
          DATABASE_URL: sqlite:///ci.sqlite3
          ENCRYPTION_KEY: Y2ktb25seS1mZXJuZXQta2V5LTMyLWJ5dGVzLWJhc2U2NC0xMg==
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: https://funcreescolombia.org
          WOMPI_ENV: sandbox
          WOMPI_PUBLIC_KEY: pub_test_ci
          WOMPI_PRIVATE_KEY: prv_test_ci
          WOMPI_INTEGRITY_SECRET: test_integrity_ci
          FRONTEND_URL: https://funcreescolombia.org
        run: python backend/manage.py check --deploy --settings=core.settings

      - name: Lint backend (ruff)
        working-directory: backend
        run: |
          python -m pip install ruff
          ruff check .

      - name: Lint frontend (eslint)
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Run backend tests
        env:
          SECRET_KEY: ci-only-secret-key-not-for-production
          DEBUG: 'True'
          DATABASE_URL: 'sqlite:///:memory:'
          ENCRYPTION_KEY: Y2ktb25seS1mZXJuZXQta2V5LTMyLWJ5dGVzLWJhc2U2NC0xMg==
          WOMPI_ENV: sandbox
          WOMPI_PUBLIC_KEY: pub_test_ci
          WOMPI_PRIVATE_KEY: prv_test_ci
          WOMPI_INTEGRITY_SECRET: test_integrity_ci
          FRONTEND_URL: https://funcreescolombia.org
        working-directory: backend
        run: python manage.py test -v 2

      - name: Dependency audit (pip-audit)
        continue-on-error: true # advisory: no rompe el pipeline, pero deja evidencia
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r backend/requirements.txt --progress-spinner off
